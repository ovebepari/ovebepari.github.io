<!DOCTYPE html>
<html lang="en-us">

  {% include head.html %}

  <body>
    <div class="site-wrapper">

    {% include nav.html %}

    <main class="content">
    
    {% if site.message %}
        <p class="deprecation-notice">{{site.message}}</p>
    {% endif %}

    {{ content }}
        
    {% if page.comments %}
      <hr>
      <h2>Comments</h2>
      <div id="disqus_thread"></div>
      <script>
      (function() {
      var d = document, s = d.createElement('script');
      s.src = 'https://ovebepari-github-io-1.disqus.com/embed.js';
      s.setAttribute('data-timestamp', +new Date());
      (d.head || d.body).appendChild(s);
      })();
      </script>
      <noscript>Please enable JavaScript to view the <a href="https://disqus.com/?ref_noscript">comments powered by Disqus.</a></noscript>       
    {% endif %}

    </main>

    {% include footer.html %}

    </div>
  </body>
</html>
